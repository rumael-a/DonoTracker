# Decides which UNMATCHED emails appear on the "Needs a rule" sheet.
# All entries are case-insensitive regular expressions except exclude_sender (plain substrings).
candidate_subject:
  - donat
  - tax receipt
  - official receipt
  - charitable
  - contribution receipt
  - 'acknowledg(e)?ment'
  - 'thank you for your (gift|donation|contribution|support)'
  - zakat
  - sadaqah
  - 'night donation'
candidate_body:
  - 'tax.?deductible'
  - '501\(c\)\(3\)'
  - charitable contribution
  - donation receipt
  - tax receipt
  - official receipt
  - no goods or services
  - cra registration
  - registered charity
  - charity reg
  - donation confirmation
exclude_subject:
  - donate to
  - why donate
  - gifts doubled
  - 'last day.*gift'
  - giving tuesday
  - swoop in
  - fundrais
  - matching gift
  - provide hope
  - 'give.*early'
  - "don.*miss out"
  - automate your
  - 'double.*gift'
  - 'gift.*double'
  - last chance
  # Gifts other people made in the user's name are NOT the user's donations (user decision 2026-09-28)
  - 'in your honou?r'
  - 'in honou?r of'
  # Follow-ups about an already-receipted gift, and tax-receipt download notices with no amount
  - '(about|for) your water well'
  - 'your well is under construction'
  - 'tax receipt is (coming soon|ready)'
  - 'download your \d{4} tax receipt'
  - 'employer match'
  - 'donation can be matched'
  - 'donation .*has failed'
  - 'donation .*has been cancel+ed'
  - 'orphan pack'
  - 'new supporter letter'
exclude_sender:
  - apple.com
  - shopify
  - etsy.com
  - uniqlo
  - priceline
  - airbnb
  - amazon
  - uber
  - doordash
  - bestbuy
  - walmart
  - costco
  - ebay
  - paypal
  - netflix
  - spotify
  - google.com
  - microsoft
  - nintendo
  - uhaul
  - footlocker
  - autotrader
  - lindt
  - simonsnewsletter
  # Appeals / newsletters from charities whose real receipts are matched by rules.yaml first
  - mail@muslimhands            # Muslim Hands Canada + USA appeals (receipts come from the same address but match rules first)
  - feedback@muslimhands        # well-construction feedback reports
  - marketing@icnareliefcanada.ca
  - info@mytennights.com        # appeals and the "no 30th night" notice; receipts come from contact@
  - info@myriadcanada.org       # newsletters; MyTenNights receipts arrive via mytennights.com
  - clomembership@birds.cornell.edu   # Cornell Lab membership appeals
  - wealthsimple
  - cibc.com
